services:
  app:
    image: randompick:latest
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_PATH: /data/randompick.db
      APP_BASE_URL: https://random.ziyang.li
    volumes:
      - randompick-data:/data
    networks:
      default: {}
      edge:
        aliases:
          - randompick-edge
    restart: unless-stopped

networks:
  edge:
    name: shared-edge
    external: true

volumes:
  randompick-data:
